# Authoritative source registry (§78). Social media is never a fact source.

sources:
  usgs:
    kind: usgs_geojson
    authority: 1.0
    enabled: true
    feeds:
      significant_hour: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_hour.geojson
      significant_week: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_week.geojson
      m4_5_week: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson
    poll_feed: significant_hour

  nws:
    kind: nws_cap
    authority: 1.0
    enabled: true
    feeds:
      alerts: https://api.weather.gov/alerts/active
    poll_feed: alerts

  eonet:
    kind: nasa_eonet
    authority: 0.9
    enabled: true
    feeds:
      events: https://eonet.gsfc.nasa.gov/api/v3/events
    poll_feed: events
    poll_every_seconds: 3600   # EONET curates daily-ish; hourly cadence

  gdacs:
    kind: gdacs
    authority: 0.9
    enabled: true
    feeds:
      rss: https://www.gdacs.org/xml/rss.xml
    poll_feed: rss
    poll_every_seconds: 1800

  swpc:
    kind: noaa_swpc
    authority: 0.95
    enabled: true
    feeds:
      alerts: https://services.swpc.noaa.gov/products/alerts.json
    poll_feed: alerts
    poll_every_seconds: 900

  acled:
    kind: acled
    authority: 0.85
    enabled: true
    requires_env: [ACLED_API_KEY, ACLED_EMAIL]   # free at developer.acleddata.com
    poll_every_seconds: 3600
    limit: 200
    feeds:
      read: https://api.acleddata.com/acled/read

  gdelt:
    kind: gdelt
    authority: 0.7
    enabled: true
    feeds:
      lastupdate: https://api.gdeltproject.org/gdeltv2/lastupdate.txt
    poll_feed: lastupdate
    poll_every_seconds: 1800
    timeout_seconds: 90          # export zip is ~10MB
    quad_classes: ["3", "4"]     # verbal + material conflict only
    min_num_sources: 2
    max_items: 300

  fred:
    kind: fred
    authority: 0.95
    enabled: true
    requires_env: [FRED_API_KEY]   # free at fredaccount.stlouisfed.org/apikeys
    poll_every_seconds: 21600      # macro data releases are daily/monthly
    feeds:
      observations: https://api.stlouisfed.org/fred/series/observations
    poll_feed: observations
    series:                      # id -> label/units/surprise scale
      UNRATE:  {label: "Unemployment Rate", units: "Percent", move_scale: 5.0}
      CPIAUCSL: {label: "CPI-U All Items", units: "Index 1982-84=100", move_scale: 1.5}
      PAYEMS:  {label: "Nonfarm Payrolls", units: "Thousands", move_scale: 1.0}
      FEDFUNDS: {label: "Fed Funds Rate", units: "Percent", move_scale: 5.0}
      GS10:    {label: "10-Year Treasury Yield", units: "Percent", move_scale: 4.0}

  bls:
    kind: bls
    authority: 0.95
    enabled: true
    # works without a key (25 req/day); BLS_API_KEY raises limits
    poll_every_seconds: 21600
    feeds:
      data: https://api.bls.gov/publicAPI/v2/timeseries/data/
    poll_feed: data
    series:
      LNS14000000: {label: "Unemployment Rate", units: "Percent", move_scale: 5.0}
      CES0000000001: {label: "Total Nonfarm Payrolls", units: "Thousands", move_scale: 1.0}
      CUSR0000SA0: {label: "CPI-U (SA)", units: "Index 1982-84=100", move_scale: 1.5}
      CES0500000003: {label: "Avg Hourly Earnings", units: "USD/hour", move_scale: 1.5}

  eia:
    kind: eia
    authority: 0.95
    enabled: true
    requires_env: [EIA_API_KEY]      # free at eia.gov/opendata/register.php
    poll_every_seconds: 3600         # weekly stocks land Wed/Thu mornings ET
    feeds:
      series: https://api.eia.gov/v2/seriesid/
    poll_feed: series
    series:                          # v2 seriesid path -> label/units/surprise scale
      PET.WCESTUS1.W: {label: "US Crude Oil Stocks (excl. SPR)", units: "thousand barrels", move_scale: 3.0}
      PET.WGTSTUS1.W: {label: "US Gasoline Stocks", units: "thousand barrels", move_scale: 3.0}
      PET.WDISTUS1.W: {label: "US Distillate Stocks", units: "thousand barrels", move_scale: 4.0}
      NG.NW2_EPG0_SWO_R48_BCF.W: {label: "US Natural Gas Storage (L48)", units: "Bcf", move_scale: 8.0}

  fema:
    kind: fema
    authority: 0.95
    enabled: true
    poll_every_seconds: 3600         # declarations are rare
    top: 60                          # recent designated-area rows to group
    feeds:
      declarations: https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries
    poll_feed: declarations

  cisa:
    kind: cisa_kev
    authority: 0.90
    enabled: true
    poll_every_seconds: 3600
    lookback_days: 2                 # only new additions become events
    feeds:
      kev: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    poll_feed: kev

  treasury:
    kind: treasury
    authority: 0.95
    enabled: true
    poll_every_seconds: 21600        # monthly data releases
    feeds:
      rates: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/avg_interest_rates
    poll_feed: rates
    securities:                      # security_desc -> label/move_scale
      "Treasury Bills":  {label: "Average T-Bill Rate",  move_scale: 1.0}
      "Treasury Notes":  {label: "Average T-Note Rate",  move_scale: 1.0}
      "Treasury Bonds":  {label: "Average T-Bond Rate",  move_scale: 1.5}
      "Treasury Inflation-Protected Securities (TIPS)": {label: "Average TIPS Rate", move_scale: 1.0}

  nhc:
    kind: noaa_nhc
    authority: 0.95
    enabled: true
    poll_every_seconds: 1800         # advisories every 6h; poll for freshness
    feeds:
      storms: https://www.nhc.noaa.gov/CurrentStorms.json
    poll_feed: storms

  coinbase:
    kind: coinbase
    authority: 0.85
    enabled: true
    poll_every_seconds: 300           # Coinbase spot snapshots, 5min cadence
    feeds:
      spot: https://api.coinbase.com/v2/prices
    poll_feed: spot
    pairs:                            # pair -> label/move_scale
      BTC-USD: {label: "Bitcoin",  move_scale: 5.0}
      ETH-USD: {label: "Ethereum", move_scale: 7.0}

  # Attributed press reports (§53) — outlets report, we attribute; these are
  # corroborating evidence, not measurements. severity_norm is keyword-based
  # and capped so press coverage never reaches BREAKING on its own.
  bbc:
    kind: news_rss
    authority: 0.75
    enabled: true
    format: rss
    outlet: "BBC World"
    poll_every_seconds: 900
    max_items: 25
    feeds:
      world: https://feeds.bbci.co.uk/news/world/rss.xml
    poll_feed: world

  timesofindia:
    kind: news_rss
    authority: 0.60
    enabled: true
    format: rss
    outlet: "Times of India"
    poll_every_seconds: 900
    max_items: 25
    feeds:
      top: https://timesofindia.indiatimes.com/rssfeedstopstories.cms
    poll_feed: top

  jpost:
    kind: news_rss
    authority: 0.65
    enabled: true
    format: rss
    outlet: "Jerusalem Post"
    poll_every_seconds: 900
    max_items: 25
    feeds:
      front: https://www.jpost.com/rss/rssfeedsfrontpage.aspx
    poll_feed: front

  aljazeera:
    kind: news_rss
    authority: 0.70
    enabled: true
    format: rss
    outlet: "Al Jazeera"
    poll_every_seconds: 900
    max_items: 25
    feeds:
      all: https://www.aljazeera.com/xml/rss/all.xml
    poll_feed: all

  omg:
    kind: news_rss
    authority: 0.40      # partisan sting outlet — attributed only, never asserted
    enabled: true
    format: wp_json       # RSS feeds disabled; WP REST API still serves posts
    outlet: "O'Keefe Media Group"
    poll_every_seconds: 1800
    max_items: 15
    feeds:
      posts: https://okeefemediagroup.com/wp-json/wp/v2/posts?per_page=15
    poll_feed: posts

  # Crime desk (§53) — Google News RSS queries aggregate local + national
  # crime coverage within minutes of publication. Federal press sites
  # (DOJ/FBI/DEA/ATF/USMS) are WAF-blocked to programmatic fetches, so
  # aggregation is the honest path. Emits `crime_report` events: headline
  # phrases score into BREAKING band; press-level confidence keeps them
  # out of the interrupt gate until corroborated.
  gnews_crime:
    kind: crime_rss
    authority: 0.55      # aggregation layer, not a primary source
    enabled: true
    format: rss
    outlet: "Google News"
    poll_every_seconds: 600
    max_items: 25
    feeds:
      crime: "https://news.google.com/rss/search?q=%22active+shooter%22+OR+%22mass+shooting%22+OR+manhunt+OR+hostage+OR+%22serial+killer%22+OR+%22school+shooting%22+OR+homicide&hl=en-US&gl=US&ceid=US:en"
    poll_feed: crime

  gnews_federal:
    kind: crime_rss
    authority: 0.55
    enabled: true
    format: rss
    outlet: "Google News"
    poll_every_seconds: 600
    max_items: 25
    feeds:
      federal: "https://news.google.com/rss/search?q=FBI+arrest+OR+%22federal+charges%22+OR+%22DOJ%22+indictment+OR+%22human+trafficking%22+OR+%22most+wanted%22&hl=en-US&gl=US&ceid=US:en"
    poll_feed: federal

# Cross-source event fusion (§16)
fusion:
  time_window_seconds: 300
  max_distance_km: 50.0
  # Press reports carry no geo and publish over hours — same-story
  # headline matching looks back a full day, not the sensor window.
  press_lookback_seconds: 86400
