# Authoritative source registry (§78). Social media is never a fact source.

sources:
  usgs:
    kind: usgs_geojson
    authority: 1.0
    enabled: true
    feeds:
      significant_hour: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_hour.geojson
      significant_week: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_week.geojson
      m4_5_week: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson
    poll_feed: significant_hour

  nws:
    kind: nws_cap
    authority: 1.0
    enabled: true
    feeds:
      alerts: https://api.weather.gov/alerts/active
    poll_feed: alerts

  eonet:
    kind: nasa_eonet
    authority: 0.9
    enabled: true
    feeds:
      events: https://eonet.gsfc.nasa.gov/api/v3/events
    poll_feed: events
    poll_every_seconds: 3600   # EONET curates daily-ish; hourly cadence

  gdacs:
    kind: gdacs
    authority: 0.9
    enabled: true
    feeds:
      rss: https://www.gdacs.org/xml/rss.xml
    poll_feed: rss
    poll_every_seconds: 1800

  swpc:
    kind: noaa_swpc
    authority: 0.95
    enabled: true
    feeds:
      alerts: https://services.swpc.noaa.gov/products/alerts.json
    poll_feed: alerts
    poll_every_seconds: 900

  acled:
    kind: acled
    authority: 0.85
    enabled: true
    requires_env: [ACLED_API_KEY, ACLED_EMAIL]   # free at developer.acleddata.com
    poll_every_seconds: 3600
    limit: 200
    feeds:
      read: https://api.acleddata.com/acled/read

  gdelt:
    kind: gdelt
    authority: 0.7
    enabled: true
    feeds:
      lastupdate: https://api.gdeltproject.org/gdeltv2/lastupdate.txt
    poll_feed: lastupdate
    poll_every_seconds: 1800
    timeout_seconds: 90          # export zip is ~10MB
    quad_classes: ["3", "4"]     # verbal + material conflict only
    min_num_sources: 2
    max_items: 300

  fred:
    kind: fred
    authority: 0.95
    enabled: true
    requires_env: [FRED_API_KEY]   # free at fredaccount.stlouisfed.org/apikeys
    poll_every_seconds: 21600      # macro data releases are daily/monthly
    feeds:
      observations: https://api.stlouisfed.org/fred/series/observations
    poll_feed: observations
    series:                      # id -> label/units/surprise scale
      UNRATE:  {label: "Unemployment Rate", units: "Percent", move_scale: 5.0}
      CPIAUCSL: {label: "CPI-U All Items", units: "Index 1982-84=100", move_scale: 1.5}
      PAYEMS:  {label: "Nonfarm Payrolls", units: "Thousands", move_scale: 1.0}
      FEDFUNDS: {label: "Fed Funds Rate", units: "Percent", move_scale: 5.0}
      GS10:    {label: "10-Year Treasury Yield", units: "Percent", move_scale: 4.0}

  bls:
    kind: bls
    authority: 0.95
    enabled: true
    # works without a key (25 req/day); BLS_API_KEY raises limits
    poll_every_seconds: 21600
    feeds:
      data: https://api.bls.gov/publicAPI/v2/timeseries/data/
    poll_feed: data
    series:
      LNS14000000: {label: "Unemployment Rate", units: "Percent", move_scale: 5.0}
      CES0000000001: {label: "Total Nonfarm Payrolls", units: "Thousands", move_scale: 1.0}
      CUSR0000SA0: {label: "CPI-U (SA)", units: "Index 1982-84=100", move_scale: 1.5}
      CES0500000003: {label: "Avg Hourly Earnings", units: "USD/hour", move_scale: 1.5}

  eia:
    kind: eia
    authority: 0.95
    enabled: true
    requires_env: [EIA_API_KEY]      # free at eia.gov/opendata/register.php
    poll_every_seconds: 3600         # weekly stocks land Wed/Thu mornings ET
    feeds:
      series: https://api.eia.gov/v2/seriesid/
    poll_feed: series
    series:                          # v2 seriesid path -> label/units/surprise scale
      PET.WCESTUS1.W: {label: "US Crude Oil Stocks (excl. SPR)", units: "thousand barrels", move_scale: 3.0}
      PET.WGTSTUS1.W: {label: "US Gasoline Stocks", units: "thousand barrels", move_scale: 3.0}
      PET.WDISTUS1.W: {label: "US Distillate Stocks", units: "thousand barrels", move_scale: 4.0}
      NG.NW2_EPG0_SWO_R48_BCF.W: {label: "US Natural Gas Storage (L48)", units: "Bcf", move_scale: 8.0}

# Cross-source event fusion (§16)
fusion:
  time_window_seconds: 300
  max_distance_km: 50.0
