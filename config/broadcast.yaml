# Broadcast Director policy (§31-§35). Deterministic; the LLM cannot change this.

rundown:
  segments:
    - {id: headlines,        title: "Top Stories",        priority: 60, max_air_every_min: 30}
    - {id: world_weather,    title: "Global Weather",     priority: 30, max_air_every_min: 45}
    - {id: earthquakes,      title: "Earthquake Activity", priority: 50, max_air_every_min: 20}
    - {id: international,    title: "International",      priority: 30, max_air_every_min: 60}
    - {id: space_weather,    title: "Space Weather",      priority: 20, max_air_every_min: 90}
    - {id: explainer,        title: "Explainer",          priority: 10, max_air_every_min: 120}

interrupt:
  # Minimum impact_level + confidence to break into programming.
  flash_min_confidence: 0.95
  breaking_min_confidence: 0.90
  sting_seconds: 2.0

states:
  - STARTING
  - NORMAL_PROGRAMMING
  - STORY
  - BREAKING
  - FLASH
  - TRANSITION
  - RECOVERY
  - DEGRADED
  - OFF_AIR

# Auto-render gate (§72): revisions at/above this impact + confidence queue a
# SHORT_RENDER job; the service loop drains the queue between poll cycles.
auto_render:
  min_impact: UPDATE
  min_confidence: 0.70

playout:
  width: 1920
  height: 1080
  fps: 30
  encoder: h264_videotoolbox
  audio: aac
  video_bitrate: 6000k
  audio_bitrate: 160k
  # Local HLS preview (§34 dry-run output). Segments append to live.m3u8;
  # the preview server serves this directory over HTTP.
  hls:
    dir: output/preview
    playlist: live.m3u8
    segment_time: 4
    list_size: 12
  standby_seconds: 20          # slate duration when the rundown has nothing
  port: 8788                   # preview HTTP port

# Output muxers. HLS local preview is always on; RTMP is the YouTube path —
# gated by `enabled` AND the env var holding the full push URL with stream
# key (NEWSROOM_RTMP_URL=rtmp://a.rtmp.youtube.com/live2/<key>). The URL is
# a secret: env-only, never in config/git (§77). publishing.automatic stays
# false until factual safety is proven (§66).
outputs:
  hls:
    enabled: true
  rtmp:
    enabled: false
    url_env: NEWSROOM_RTMP_URL
