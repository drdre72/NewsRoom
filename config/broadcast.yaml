# Broadcast Director policy (§31-§35). Deterministic; the LLM cannot change this.

rundown:
  segments:
    - {id: crime,            title: "Crime Desk",         priority: 90, max_air_every_min: 15}
    - {id: headlines,        title: "Top Stories",        priority: 60, max_air_every_min: 30}
    # Weather is relegated to the rolling ticker strip (lower third,
    # unread by TTS) — it no longer airs as full stories. FLASH weather
    # (tornado warnings, etc.) still interrupts via pick_interrupt.
    - {id: earthquakes,      title: "Earthquake Activity", priority: 50, max_air_every_min: 20}
    - {id: international,    title: "International",      priority: 30, max_air_every_min: 60}
    - {id: space_weather,    title: "Space Weather",      priority: 20, max_air_every_min: 90}
    - {id: us_desk,          title: "U.S. Desk",          priority: 40, max_air_every_min: 45}
    - {id: markets,          title: "Markets",           priority: 35, max_air_every_min: 15}
    - {id: economy,          title: "Economy",            priority: 15, max_air_every_min: 60}
    - {id: explainer,        title: "Explainer",          priority: 10, max_air_every_min: 120}

interrupt:
  # Minimum impact_level + confidence to break into programming.
  flash_min_confidence: 0.95
  breaking_min_confidence: 0.90
  sting_seconds: 2.0

states:
  - STARTING
  - NORMAL_PROGRAMMING
  - STORY
  - BREAKING
  - FLASH
  - TRANSITION
  - RECOVERY
  - DEGRADED
  - OFF_AIR

# Auto-render gate (§72): revisions at/above this impact + confidence queue a
# SHORT_RENDER job; the service loop drains the queue between poll cycles.
auto_render:
  min_impact: UPDATE
  min_confidence: 0.70

# Replay rotation (§31): when the rundown is empty, re-air stories whose
# current revision already premiered, least-recently-aired first, instead of
# idling on the standby slate. Replays are filler — any interrupt or fresh
# rundown item preempts them mid-air, and replay airings never count toward
# segment cadence. The slate only runs when nothing airable exists at all.
replay:
  enabled: true

playout:
  width: 1920
  height: 1080
  fps: 30
  # libx264 CBR — VideoToolbox rate control has no floor and undershoots
  # to ~1.5 Mbps on the mostly-static newsroom picture, which ingest
  # rejects as insufficient. Software encode at 1080p30/veryfast is cheap.
  encoder: libx264
  preset: ultrafast          # render drain competes for CPU; CBR hides the quality hit on static content
  video_bitrate: 6800k         # YouTube's recommended floor for 1080p30
  bufsize: 13600k
  gop_seconds: 2               # keyframe every 2 s (ingest recommendation)
  audio: aac
  audio_bitrate: 160k
  ticker_speed: 110          # px/sec — readable crawl, not cable-news sprint
  # Local HLS preview (§34 dry-run output). Segments append to live.m3u8;
  # the preview server serves this directory over HTTP.
  hls:
    dir: output/preview
    playlist: live.m3u8
    segment_time: 4
    list_size: 12
  standby_seconds: 20          # slate duration when the rundown has nothing
  port: 8788                   # preview HTTP port

# Output muxers. HLS local preview is always on; RTMP is the YouTube path —
# a persistent `python main.py rtmp-relay` agent follows live.m3u8 and
# remuxes it to YouTube with one long-lived connection (per-program encodes
# must NOT tee RTMP themselves: the connect/disconnect churn at each
# program boundary makes ingest flag "not receiving enough video").
# gated by `enabled` AND the env var holding the full push URL with stream
# key (NEWSROOM_RTMP_URL=rtmp://a.rtmp.youtube.com/live2/<key>). The URL is
# a secret: env-only, never in config/git (§77). publishing.automatic stays
# false until factual safety is proven (§66).
outputs:
  hls:
    enabled: true
  rtmp:
    enabled: true
    url_env: NEWSROOM_RTMP_URL
    stall_seconds: 45          # pause the push when no fresh HLS segments
