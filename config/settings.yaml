# Core newsroom settings. Paths are relative to the project root unless absolute.

project:
  name: newsroom

paths:
  db: newsroom.db
  logs: logs
  cache: cache
  output: output
  fixtures: src/newsroom/sim/fixtures

polling:
  interval_seconds: 60
  timeout_seconds: 20
  user_agent: "newsroom/0.1 (local-first; contact: local)"

storage:
  cache_max_gb: 30
  min_free_gb: 10     # stop heavy renders before the Mac runs out of space
  frame_retention_hours: 12
  intermediate_retention_days: 3
  media_retention_days: 7        # videos become recipe-eligible after this
  pressure_retention_days: 2     # sooner when free < 2x min_free_gb
  recipes_dir: output/recipes
  auto_dehydrate: false          # §52 — operator flips after reviewing a
                                 # retention report; never default-on
  sweep_interval_hours: 24
  max_dehydrate_per_sweep: 10

archive:
  enabled: true                  # iCloud Drive archive of completed masters
  icloud_dir: "~/Library/Mobile Documents/com~apple~CloudDocs/newsroom"
  max_gb_per_run: 5              # bounded copies; macOS syncs async, so an
                                 # archive pass never competes with renders
  interval_hours: 1              # service sweeps: masters reach iCloud
                                 # within the hour; TripMode may hold sync
                                 # while gaming — copies queue locally

workers:
  llm: 1
  tts: 1
  whisper: 1
  map_render: 1
  video_render: 1

publishing:
  automatic: true    # §66 — operator-approved go-live 2026-11-09; the
                     # publication gate still gates every render first
  youtube:
    uploads_enabled: false  # Separate approval from the live RTMP master switch.
    max_per_day: 100   # quota bucket is 100 uploads/day (June 2026)
    privacy: public    # public | unlisted | private
    best_of_day_top_n: 10  # daily playlist size
  tiktok:
    # Manual post desk (@justsystemnews). TikTok's Content Posting API
    # audit rejects self-upload tools, so the compliant path is render ->
    # draft package -> operator posts at tiktok.com/upload. There is no
    # automated upload switch to enable.
    handle: "@justsystemnews"
    drafts_enabled: true
    max_drafts_per_day: 3    # FYP rewards consistency, not volume

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: ""            # set in models.yaml or env; empty = auto-detect first installed
  max_concurrent_jobs: 1
  timeout_seconds: 120
  temperature: 0.2

tts:
  # Preference order. First available backend wins. Locked to kokoro_mlx:
  # `say` stays in the codebase for dev environments, but nothing airs in a
  # voice that hasn't passed a listen test.
  backend_order: [kokoro_mlx]
  kokoro_voice: "af_heart"   # the approved on-air voice (models.yaml sets same)
  say_voice: "Samantha"      # macOS dev voice — not used while order is kokoro-only
  strict_voice: true   # no mid-render voice fallback; a failed render is
                       # better than airing the wrong voice
  sample_rate: 24000

alignment:
  whisper_binary: ""       # path to whisper-cli; empty = auto-detect
  model_path: "models/ggml-base.en.bin"   # ggml model, root-relative

video:
  shorts:
    width: 1080
    height: 1920
    fps: 30
    max_duration_s: 60
  longform:
    width: 1920
    height: 1080
    fps: 30
  tiktok:
    width: 1080
    height: 1920
    fps: 30
    min_rewards_s: 61   # Creator Rewards only counts videos over 1 minute
  encoder_preference: [h264_videotoolbox, libx264]
  audio_codec: aac
  audio_bitrate: 160k
