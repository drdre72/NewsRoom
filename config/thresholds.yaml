# Deterministic scoring configuration (§13, §14).

impact:
  # Earthquake feature weights; each feature normalizes to 0..1 first.
  earthquake:
    magnitude:
      weight: 0.45
      min: 2.5        # mag <= min -> 0
      max: 9.5        # mag >= max -> 1
    significance:
      weight: 0.25
      min: 0
      max: 1000
    tsunami_flag:
      weight: 0.15    # binary 0/1
    alert_level:      # PAGER-style
      weight: 0.15
      values: {green: 0.2, yellow: 0.5, orange: 0.75, red: 1.0}
    shallow_depth:
      weight: 0.0     # reserved; depth_km <= 35 -> 1, <= 70 -> 0.5 else 0

  # NWS CAP alerts: alert type dominates, then CAP severity/certainty/urgency.
  weather_alert:
    alert_criticality:
      weight: 0.40
      default: 0.25      # unlisted alert types
      values:
        tornado emergency: 1.0
        tornado warning: 1.0
        tsunami warning: 1.0
        flash flood emergency: 1.0
        hurricane warning: 0.9
        typhoon warning: 0.9
        storm surge warning: 0.9
        extreme wind warning: 0.9
        flash flood warning: 0.8
        severe thunderstorm warning: 0.55
        flood warning: 0.55
        winter storm warning: 0.45
        tornado watch: 0.4
        red flag warning: 0.4
        severe thunderstorm watch: 0.3
        flood watch: 0.3
        heat advisory: 0.2
    cap_severity:
      weight: 0.25
      values: {extreme: 1.0, severe: 0.75, moderate: 0.45, minor: 0.2}
    certainty:
      weight: 0.20
      values: {observed: 1.0, likely: 0.7, possible: 0.4, unlikely: 0.15}
    urgency:
      weight: 0.15
      values: {immediate: 1.0, expected: 0.7, future: 0.3, past: 0.1}

  # EONET natural events — generic severity+category scorer. `severity` is
  # the raw magnitudeValue (acres, kts, VEI-class); category carries most of
  # the newsworthiness. Closed events lose `closed_penalty`.
  wildfire:
    severity:   {weight: 0.45, min: 100, max: 500000}   # acres burned
    category:   {weight: 0.35, default: 0.3, values: {wildfires: 0.75}}
    closed_penalty: 0.5
  volcano:
    severity:   {weight: 0.35, min: 0, max: 5}          # VEI-class index
    category:   {weight: 0.45, default: 0.3, values: {volcanoes: 0.8}}
    closed_penalty: 0.4
  severe_storm:
    severity:   {weight: 0.45, min: 20, max: 180}       # wind kts
    category:   {weight: 0.35, default: 0.3, values: {severeStorms: 0.6}}
    closed_penalty: 0.4
  flood:
    severity:   {weight: 0.35, min: 0, max: 10}
    category:   {weight: 0.45, default: 0.35, values: {floods: 0.6}}
    closed_penalty: 0.4
  landslide:
    severity:   {weight: 0.3, min: 0, max: 10}
    category:   {weight: 0.45, default: 0.35, values: {landslides: 0.55}}
    closed_penalty: 0.4
  snow:
    severity:   {weight: 0.3, min: 0, max: 200}
    category:   {weight: 0.4, default: 0.25, values: {snow: 0.4}}
    closed_penalty: 0.4
  drought:
    severity:   {weight: 0.3, min: 0, max: 10}
    category:   {weight: 0.4, default: 0.25, values: {drought: 0.35}}
    closed_penalty: 0.3
  sea_ice:
    severity:   {weight: 0.3, min: 0, max: 10}
    category:   {weight: 0.4, default: 0.2, values: {seaLakeIce: 0.3}}
    closed_penalty: 0.3
  temp_extreme:
    severity:   {weight: 0.35, min: 0, max: 10}
    category:   {weight: 0.4, default: 0.3, values: {tempExtremes: 0.5}}
    closed_penalty: 0.3

  # GDACS + SWPC families — same generic scorer (severity + category +
  # alert_level mappings). NOTE: mapped values are matched lower-cased.
  tropical_cyclone:
    severity:   {weight: 0.4, min: 30, max: 180}        # wind kts
    category:   {weight: 0.3, default: 0.4}
    alert_level: {weight: 0.3, values: {green: 0.2, orange: 0.7, red: 1.0}}
  tsunami_warning:
    severity:   {weight: 0.4, min: 0, max: 10}
    category:   {weight: 0.3, default: 0.6}
    alert_level: {weight: 0.3, values: {green: 0.3, orange: 0.7, red: 1.0}}
  space_weather:
    severity:   {weight: 0.5, min: 3, max: 9}           # planetary K-index
    category:   {weight: 0.3, default: 0.35}
    alert_level: {weight: 0.2, values: {g1: 0.4, g2: 0.55, g3: 0.7, g4: 0.85,
                                        g5: 1.0, r1: 0.3, r2: 0.45, r3: 0.6,
                                        r4: 0.75, r5: 0.9, s1: 0.3, s2: 0.45,
                                        s3: 0.6, s4: 0.75, s5: 0.9}}

  # ACLED + GDELT share conflict_event — severity_norm is adapter-computed
  # (fatalities/50 vs mentions/150) so the units don't collide.
  conflict_event:
    severity:   {weight: 0.5, min: 0, max: 1}           # reads severity_norm
    category:   {weight: 0.35, default: 0.4,
                 values: {battles: 0.8, "explosions/remote violence": 0.85,
                          "violence against civilians": 0.9,
                          "strategic developments": 0.4,
                          "material conflict": 0.6,
                          "verbal conflict": 0.35}}
  protest:
    severity:   {weight: 0.4, min: 0, max: 1}
    category:   {weight: 0.3, default: 0.35,
                 values: {protests: 0.4, riots: 0.55}}

  levels:            # score -> level (first match wins, top-down)
    FLASH: 0.85
    BREAKING: 0.60
    UPDATE: 0.35
    NORMAL: 0.15
    # below -> BACKGROUND

confidence:
  base_by_source:    # source authority -> base confidence
    usgs: 0.95
    nws: 0.95
    swpc: 0.90
    acled: 0.75        # curated but NGO — below govt feeds
    gdacs: 0.80
    eonet: 0.80
    gdelt: 0.60        # media aggregation — corroboration, not authority
    default: 0.50
  reviewed_bonus: 0.05        # source marked event "reviewed"
  corroboration_bonus: 0.05   # per extra corroborating source, max +0.10
  max: 1.0
  # Production eligibility gates (§14)
  auto_publish_min: 0.95
  corroborate_min: 0.70

high_risk_fields:  # §15 — always require review, never auto-assert
  - casualties
  - fatalities
  - injuries
  - cause
  - attribution
  - perpetrator
