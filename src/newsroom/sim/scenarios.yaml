# Simulation scenarios (§51, §53). Each feed item is applied in order with
# virtual retrieved_at offsets so revision ordering is deterministic.

earthquake_major:
  description: Single significant USGS event, full render path.
  render: true
  items:
    - {adapter: usgs, file: earthquake_major.geojson, at_offset_s: 0}

earthquake_revision_sequence:
  description: Same source event revised 3x — exercises fact supersession.
  render: true
  items:
    - {adapter: usgs, file: earthquake_rev1.geojson, at_offset_s: 0}
    - {adapter: usgs, file: earthquake_rev2.geojson, at_offset_s: 600}
    - {adapter: usgs, file: earthquake_rev3.geojson, at_offset_s: 1800}

malformed_payload:
  description: Unparseable source item must be skipped, not crash.
  render: false
  items:
    - {adapter: usgs, file: malformed.geojson, at_offset_s: 0}

nws_tornado_warning:
  description: NWS tornado warning — second event family, full render (§86).
  render: true
  items:
    - {adapter: nws, file: nws_warning.json, at_offset_s: 0}

nws_alert_revision:
  description: Same alert upgraded Likely->Observed; certainty supersession.
  render: true
  items:
    - {adapter: nws, file: nws_warning.json, at_offset_s: 0}
    - {adapter: nws, file: nws_warning_rev2.json, at_offset_s: 900}

wildfire_event:
  description: EONET wildfire — third event family; acreage growth revision.
  render: true
  items:
    - {adapter: eonet, file: eonet_wildfire.json, at_offset_s: 0}
    - {adapter: eonet, file: eonet_wildfire_rev2.json, at_offset_s: 21600}

hurricane_advisory:
  description: GDACS red tropical cyclone — alert_level scoring + fusion type.
  render: true
  items:
    - {adapter: gdacs, file: gdacs_cyclone.xml, at_offset_s: 0}

space_weather_storm:
  description: SWPC geomagnetic storm — repeated serials revise one event.
  render: true
  items:
    - {adapter: swpc, file: swpc_alert_k7a.json, at_offset_s: 0}
    - {adapter: swpc, file: swpc_alert_k7b.json, at_offset_s: 3600}

conflict_reports:
  description: ACLED battle + GDELT conflict — shared conflict_event family.
  render: true
  items:
    - {adapter: acled, file: acled_battle.json, at_offset_s: 0}
    - {adapter: gdelt, file: gdelt_conflict.json, at_offset_s: 900}

# Fixtures for adapter families landing in later phases (§53).
security_bulletin:      {description: "fixture only — high-risk fields omitted", render: false, items: []}
source_outage:          {description: "simulated fetch failure; keeps last verified state", render: false, items: []}

macro_release:
  description: FRED CPI + BLS payrolls — the economy desk.
  render: true
  items:
    - {adapter: fred, file: fred_cpi.json, at_offset_s: 0}
    - {adapter: bls, file: bls_payrolls.json, at_offset_s: 600}
