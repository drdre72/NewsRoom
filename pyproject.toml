[project]
name = "newsroom"
version = "0.1.0"
description = "Mac-native autonomous live newsroom: local-first crisis intelligence, visualization, and broadcast on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "pillow>=10.4.0",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
# Optional production backends — the pipeline degrades gracefully without them.
tts = ["mlx-audio>=0.2.0", "misaki[en]>=0.9.4"]
maps = ["playwright>=1.45.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
newsroom = "newsroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
